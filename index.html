<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071426">
<title>Tech Titans | Cyber Awareness 360° Training</title>
<style>
:root{color-scheme:dark;--bg:#071426;--muted:#9eb0c7;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#fff;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}.topbar{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 20px;background:rgba(7,20,38,.97);border-bottom:1px solid var(--line);box-shadow:0 8px 28px #0003}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#176fc7,#2ec4b6);font-size:21px}.brand strong{display:block;font-size:14px;letter-spacing:.04em}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.nav{display:flex;gap:8px;align-items:center}.nav button{border:1px solid var(--line);background:#10233b;color:#dbe8f8;padding:10px 14px;border-radius:10px;font:600 12px inherit;cursor:pointer;white-space:nowrap}.nav button[aria-pressed=true]{background:#174b7d;border-color:#4da3ff;color:white;box-shadow:inset 0 0 0 1px #4da3ff}
.stage{position:relative;flex:1;min-height:0;background:#000}.experience{display:block;width:100%;height:100%;border:0;background:#000}.status{position:absolute;left:14px;bottom:12px;z-index:2;pointer-events:none;background:#071426c9;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:#c5d5e9;font-size:11px;backdrop-filter:blur(8px)}
@media(max-width:650px){.topbar{padding:10px;align-items:flex-start;flex-direction:column;gap:10px}.brand strong{font-size:13px}.nav{width:100%}.nav button{flex:1;padding:10px 7px;font-size:11px}.status{left:8px;bottom:8px;font-size:10px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="mark" aria-hidden="true">🛡️</div><div><strong>TECH TITANS · CYBER AWARENESS</strong><small>Interactive 360° security training</small></div></div>
  <nav class="nav" aria-label="Choose training environment">
    <button type="button" data-scene="office" aria-pressed="true">Office Training</button>
    <button type="button" data-scene="warehouse" aria-pressed="false">Warehouse Training</button>
  </nav>
</header>
<main class="stage">
  <iframe class="experience" id="experience" title="Office cyber awareness training" src="./office/index.html" allow="fullscreen; autoplay; xr-spatial-tracking; gyroscope; accelerometer" allowfullscreen></iframe>
  <div class="status" id="status" aria-live="polite">Environment: Office · switch environments anytime using the top navigation</div>
</main>
</div>
<script>
(function(){
 const frame=document.getElementById('experience'),status=document.getElementById('status');
 const buttons=Array.from(document.querySelectorAll('[data-scene]'));
 const scenes={office:{src:'./office/index.html',title:'Office cyber awareness training',label:'Office'},warehouse:{src:'./cyberawareprototype/index.html',title:'Warehouse cyber awareness training',label:'Warehouse'}};
 function selectScene(name){
  const scene=scenes[name];if(!scene)return;
  const target=new URL(scene.src,location.href).pathname;
  if(new URL(frame.src,location.href).pathname!==target)frame.src=scene.src;
  frame.title=scene.title;status.textContent='Environment: '+scene.label+' · switch environments anytime using the top navigation';
  buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.scene===name)));
 }
 buttons.forEach(button=>button.addEventListener('click',()=>selectScene(button.dataset.scene)));
 window.addEventListener('keydown',event=>{if((event.altKey||event.metaKey)&&event.key==='1'){event.preventDefault();selectScene('office')}if((event.altKey||event.metaKey)&&event.key==='2'){event.preventDefault();selectScene('warehouse')}});
})();
</script>
</body>
</html>
